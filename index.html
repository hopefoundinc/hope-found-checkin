  <style>
    :root {
      --teal: #0A5A5F; --teal-dark: #06413F; --teal-tint: #EDF3F3;
      --ink: #1B2121; --ink-2: #485252; --ink-3: #6E7878;
      --cream: #F7F4EF; --surface: #FDFCFA; --row-bg: #F5F2ED;
      --line: #E9E4DC; --line-strong: #D9D2C6;
      --flag: #8F3B18; --flag-tint: #FAEEE9; --flag-border: #D9B3A3;
      --wfh-tint: #EAF1F7; --wfh-ink: #2B5876; --wfh-border: #BBD3E3;
      --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
      --t-xs: 12px; --t-sm: 13px; --t-md: 15px; --t-base: 16px; --t-lg: 19px; --t-xl: 24px; --t-2xl: 30px;
      --r-pill: 999px; --r-card: 18px; --r-sm: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
    body {
      background: var(--cream); color: var(--ink);
      font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: var(--t-base); line-height: 1.45;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    h1, h2 { font-family: "Source Serif 4", Georgia, serif; font-weight: 700; margin: 0; }
    a { color: var(--teal); }
    a:hover { color: var(--teal-dark); }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    .phone-wrap { min-height: 100vh; display: flex; justify-content: center; background: var(--cream); }
    .phone { width: 100%; max-width: 640px; background: var(--surface); min-height: 100vh; display: flex; flex-direction: column; min-width: 0; }
    .phone * { min-width: 0; }
    @media (max-width: 640px) {
      .phone { max-width: none; }
    }

    header.top { padding: var(--s-5) var(--s-4) var(--s-3); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
    .brand { font-family: "Source Serif 4", Georgia, serif; font-weight: 700; font-size: var(--t-lg); color: var(--teal-dark); }
    .btn-pill-outline { background: var(--surface); border: 1px solid var(--teal); color: var(--teal); border-radius: var(--r-pill); padding: 8px 16px; font-size: var(--t-sm); font-weight: 600; cursor: pointer; white-space: nowrap; }
    footer.bottom { margin-top: auto; border-top: 1px solid var(--line); padding: var(--s-3) var(--s-4); font-size: var(--t-xs); color: var(--ink-3); display: flex; justify-content: space-between; }

    .screen { padding: var(--s-5) var(--s-4); display: flex; flex-direction: column; gap: var(--s-4); flex: 1; }
    .eyebrow { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }

    .btn-primary { width: 100%; min-height: 60px; background: var(--teal); color: #fff; border: none; border-radius: var(--r-pill); font-size: var(--t-lg); font-weight: 700; cursor: pointer; }
    .btn-primary:active { background: var(--teal-dark); }
    .btn-secondary { width: 100%; min-height: 52px; background: var(--surface); border: 1.5px solid var(--teal); color: var(--teal-dark); border-radius: var(--r-pill); font-size: var(--t-md); font-weight: 700; cursor: pointer; }
    .btn-secondary.selected { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn-primary:disabled { background: var(--line-strong); color: var(--ink-3); cursor: not-allowed; }
    .btn-plain { width: 100%; min-height: 48px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-pill); color: var(--ink); font-size: var(--t-md); font-weight: 600; cursor: pointer; }
    .btn-plain:hover { border-color: var(--teal); }

    .card { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
    .card-pad { padding: var(--s-4); }
    .tint-card { background: var(--teal-tint); border: 1px solid #9CBCBC; border-radius: var(--r-card); padding: var(--s-4); }
    .flag-card { background: var(--flag-tint); border: 1px solid var(--flag-border); border-radius: var(--r-card); padding: var(--s-4); }
    .row-bg-card { background: var(--row-bg); border: 1px solid var(--line-strong); border-radius: var(--r-card); padding: var(--s-4); }

    .now-card { background: var(--teal-tint); border-radius: var(--r-card); padding: var(--s-4); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
    .now-value { font-family: "Source Serif 4", Georgia, serif; font-weight: 700; font-size: 30px; color: var(--teal-dark); font-variant-numeric: tabular-nums; margin-top: 2px; }

    .badge { display: inline-block; padding: 4px 12px; font-size: var(--t-xs); font-weight: 700; border-radius: var(--r-pill); border: 1px solid; white-space: nowrap; }
    .chip-present { background: #fff; color: var(--teal-dark); border-color: #9CBCBC; }
    .chip-field { background: #fff; color: var(--teal-dark); border-color: var(--teal); }
    .chip-wfh { background: var(--wfh-tint); color: var(--wfh-ink); border-color: var(--wfh-border); }
    .chip-flag { background: var(--flag-tint); color: var(--flag); border-color: var(--flag-border); }
    .chip-muted { background: #fff; color: var(--ink-2); border-color: var(--line-strong); }

    .note-toggle { background: none; border: none; padding: 0; min-height: 44px; display: flex; align-items: center; gap: var(--s-2); color: var(--teal); cursor: pointer; font-size: var(--t-md); font-weight: 600; }
    .note-input { width: 100%; margin-top: var(--s-2); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 10px; resize: vertical; background: var(--surface); }

    .receipt { width: 100%; border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; text-align: left; }
    .receipt-row { display: flex; justify-content: space-between; gap: var(--s-3); padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row .rlabel { color: var(--ink-3); flex-shrink: 0; }
    .receipt-row .rvalue { text-align: right; word-break: break-word; font-weight: 600; }

    .icon-circle { border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .field-label { font-size: var(--t-sm); color: var(--ink-2); font-weight: 600; display: block; margin-bottom: 4px; }
    .field-input { display: block; width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 10px 12px; font-size: var(--t-md); background: var(--surface); }
    .field-hint { font-size: var(--t-xs); color: var(--ink-3); margin: 2px 0 4px; }

    .pill-chip { border: 1px solid var(--teal); background: var(--surface); color: var(--teal-dark); border-radius: var(--r-pill); padding: 9px 16px; font-size: var(--t-sm); font-weight: 700; cursor: pointer; }
    .pill-chip.selected { background: var(--teal); color: #fff; }
    .chip-row { display: flex; flex-wrap: wrap; gap: var(--s-2); }

    .req-card { border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s-4); margin-bottom: var(--s-3); }
    .req-card-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); }
    .req-actions { display: flex; gap: var(--s-2); margin-top: var(--s-3); }
    .req-actions .btn-plain, .req-actions .btn-secondary { min-height: 40px; font-size: var(--t-sm); }
    .link-btn { background: none; border: none; padding: 0; color: var(--teal); font-weight: 600; cursor: pointer; font-size: var(--t-sm); }
    .back-link { align-self: flex-start; background: none; border: none; padding: 0; color: var(--teal); cursor: pointer; font-size: var(--t-md); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div class="phone-wrap">
    <div class="phone">
      <header class="top">
        <div class="brand">Hope Found Attendance</div>
        <button id="headerTimeOffBtn" type="button" class="btn-pill-outline" style="display:none">Time off</button>
      </header>
      <div id="app" style="flex:1;display:flex;flex-direction:column"></div>
      <footer class="bottom">
        <span>Hope Found, Inc.</span>
        <span id="footerRole"></span>
      </footer>
    </div>
  </div>

  <script>
    // Points at the checkin Apps Script project's own deployment URL. If
    // that project is ever redeployed to a NEW deployment (not just "New
    // version" on the existing one - see README "Updating a deployment"),
    // this constant needs to be updated to match.
    var BACKEND_URL = 'https://script.google.com/macros/s/AKfycby0uH7T6YcutmnlbE5N2tzRuSNV1FZkyZWVuEexw5w3IFPZhyGAfv1uX36d7HKQdZ-3dA/exec';

    var TOKEN = new URLSearchParams(window.location.search).get('t');

    /**
     * Content-Type: text/plain keeps this a CORS "simple request" (no
     * preflight, which Apps Script's web app endpoint can't answer) - see
     * the matching comment on doPost in checkin/Code.js.
     */
    function call(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fnName, args: args })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.error) throw new Error(data.error);
          return data;
        });
    }

    var TIMEOFF_TYPES = ['Off', 'Vacation', 'Appointment', 'WFH', 'Family'];
    var ctx = {
      noteOpen: false, note: '', pendingStatus: null, pendingGeo: null,
      editingRequestId: null, timeOffFormValues: {}, timeOffType: 'Off',
      selectedStatus: null
    };

    function render(html) {
      document.getElementById('app').innerHTML = html;
    }

    function setFooterRole() {
      document.getElementById('footerRole').textContent = ctx.empRole || '';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // ---- one-time home-screen tip, remembered per device -------------------

    function seenHomeTip() {
      try { return localStorage.getItem('hf_seen_home_tip') === '1'; } catch (e) { return true; }
    }
    function markHomeTipSeen() {
      try { localStorage.setItem('hf_seen_home_tip', '1'); } catch (e) { /* ignore */ }
    }

    // ---- status chip helpers ------------------------------------------------

    function statusLabel_() {
      if (ctx.status === 'Field') return 'Field';
      if (ctx.status === 'WFH') return 'WFH';
      return 'Present';
    }
    function statusChipClass_(status) {
      if (status === 'Field') return 'chip-field';
      if (status === 'WFH') return 'chip-wfh';
      return 'chip-present';
    }
    function statusChipHtml_(status) {
      return '<span class="badge ' + statusChipClass_(status) + '">' + escapeHtml(status) + '</span>';
    }

    // ---- views ---------------------------------------------------------

    function renderLoading() {
      render(
        '<div class="screen">' +
          '<div role="status" style="font-size:var(--t-sm);color:var(--ink-3)">Loading your check-in page</div>' +
          '<div style="height:26px;background:var(--row-bg);border-radius:var(--r-sm);width:72%"></div>' +
          '<div style="height:16px;background:var(--row-bg);border-radius:var(--r-sm);width:54%"></div>' +
          '<div style="height:72px;background:var(--row-bg);border-radius:var(--r-card)"></div>' +
          '<div style="height:52px;background:var(--row-bg);border-radius:var(--r-pill)"></div>' +
        '</div>'
      );
    }

    function showInvalidView(message) {
      render(
        '<div class="screen" style="align-items:center;text-align:center;justify-content:center">' +
          '<div class="icon-circle" style="width:64px;height:64px;border:1px solid var(--line-strong)">' +
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#485252" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>' +
          '</div>' +
          '<h1 style="font-size:var(--t-xl);line-height:1.35">This link isn&#39;t working</h1>' +
          '<p style="margin:0;font-size:var(--t-md);color:var(--ink-2);max-width:290px">' + escapeHtml(message) + '</p>' +
        '</div>'
      );
    }

    function renderFirst() {
      render(
        '<div class="screen">' +
          '<div class="eyebrow">One-time setup</div>' +
          '<h1 style="font-size:var(--t-xl)">Add this page to your home screen</h1>' +
          '<p style="margin:0;font-size:var(--t-md);color:var(--ink-2)">Then checking in each morning takes one tap. This link is personal to you. Please don&#39;t share it.</p>' +
          '<div class="card">' +
            '<div style="padding:10px 14px;background:var(--row-bg);border-bottom:1px solid var(--line);border-radius:var(--r-card) var(--r-card) 0 0;font-size:var(--t-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3)">iPhone, Safari</div>' +
            '<ol style="margin:0;padding:var(--s-3) var(--s-4) var(--s-3) 34px;font-size:var(--t-sm);color:var(--ink-2);line-height:1.9">' +
              '<li>Tap the Share button at the bottom.</li>' +
              '<li>Scroll and tap Add to Home Screen.</li>' +
              '<li>Tap Add in the top right.</li>' +
            '</ol>' +
          '</div>' +
          '<div class="card">' +
            '<div style="padding:10px 14px;background:var(--row-bg);border-bottom:1px solid var(--line);border-radius:var(--r-card) var(--r-card) 0 0;font-size:var(--t-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3)">Android, Chrome</div>' +
            '<ol style="margin:0;padding:var(--s-3) var(--s-4) var(--s-3) 34px;font-size:var(--t-sm);color:var(--ink-2);line-height:1.9">' +
              '<li>Tap the three-dot menu at the top right.</li>' +
              '<li>Tap Add to Home screen.</li>' +
              '<li>Tap Install or Add.</li>' +
            '</ol>' +
          '</div>' +
          '<button id="btn-continue" type="button" class="btn-primary">Continue to check-in</button>' +
        '</div>'
      );
      document.getElementById('btn-continue').addEventListener('click', function () {
        markHomeTipSeen();
        renderMain();
      });
    }

    function statusButtonClass_(status) {
      return 'btn-secondary' + (ctx.selectedStatus === status ? ' selected' : '');
    }

    function paintMain() {
      render(
        '<div class="screen">' +
          '<div>' +
            '<div class="eyebrow">Check in</div>' +
            '<h1 style="font-size:var(--t-2xl)">Good morning, ' + escapeHtml(ctx.firstName) + '</h1>' +
            '<div style="margin-top:6px;font-size:var(--t-md);color:var(--ink-2)">' + escapeHtml(ctx.todayLong) + '</div>' +
          '</div>' +
          (ctx.nowLabel
            ? '<div class="now-card"><div><div class="eyebrow">Now</div><div class="now-value">' + escapeHtml(ctx.nowLabel) + '</div></div>' +
              '<span class="badge chip-muted">Not checked in</span></div>'
            : '') +
          '<div class="field-label" style="margin-bottom:0">Choose one</div>' +
          '<button id="btn-checkin" type="button" class="' + statusButtonClass_('Present') + '" aria-pressed="' + (ctx.selectedStatus === 'Present') + '">I am in</button>' +
          '<button id="btn-wfh" type="button" class="' + statusButtonClass_('WFH') + '" aria-pressed="' + (ctx.selectedStatus === 'WFH') + '">WFH</button>' +
          '<button id="btn-field" type="button" class="' + statusButtonClass_('Field') + '" aria-pressed="' + (ctx.selectedStatus === 'Field') + '">In the field</button>' +
          '<div>' +
            '<label class="field-label" for="noteInput">Note for your manager (optional)</label>' +
            '<textarea id="noteInput" class="note-input" style="margin-top:0" placeholder="e.g. in the field, be in at 2" rows="3">' + escapeHtml(ctx.note) + '</textarea>' +
          '</div>' +
          '<button id="btn-submit" type="button" class="btn-primary"' + (ctx.selectedStatus ? '' : ' disabled') + '>Submit check-in</button>' +
          '<p style="margin:auto 0 0;font-size:var(--t-sm);color:var(--ink-2);line-height:1.5">Pick one option, add a note if you like, then tap Submit. Your location is recorded once, only when you submit.</p>' +
        '</div>'
      );
      var noteEl = document.getElementById('noteInput');
      noteEl.addEventListener('input', function (e) { ctx.note = e.target.value; });

      // Tapping a status only selects it - nothing is sent until Submit.
      [['btn-checkin', 'Present'], ['btn-wfh', 'WFH'], ['btn-field', 'Field']].forEach(function (pair) {
        document.getElementById(pair[0]).addEventListener('click', function () {
          ctx.note = noteEl.value;
          ctx.selectedStatus = pair[1];
          paintMain();
        });
      });
      document.getElementById('btn-submit').addEventListener('click', function () {
        if (ctx.selectedStatus) startCheckIn(ctx.selectedStatus);
      });
    }

    function renderMain() {
      ctx.selectedStatus = null;
      paintMain();
    }

    function renderLocating() {
      render(
        '<div class="screen" style="align-items:center;justify-content:center;text-align:center">' +
          '<div class="icon-circle" style="width:56px;height:56px;border:2px solid var(--teal)">' +
            '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0A5A5F" stroke-width="1.8" aria-hidden="true"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>' +
          '</div>' +
          '<h1 role="status" style="font-size:var(--t-xl)">Checking location</h1>' +
          '<p style="margin:0;font-size:var(--t-md);color:var(--ink-2);max-width:260px">This takes a few seconds. Keep the page open.</p>' +
        '</div>'
      );
    }

    function renderSaving() {
      render(
        '<div class="screen" style="align-items:center;justify-content:center;text-align:center">' +
          '<div class="icon-circle" style="width:76px;height:76px;background:var(--row-bg)">' +
            '<div class="icon-circle" style="width:26px;height:26px;border:2px solid var(--teal-dark)"><div style="width:8px;height:8px;border-radius:50%;background:var(--teal-dark)"></div></div>' +
          '</div>' +
          '<h1 role="status" style="font-size:var(--t-xl)">Recording your check-in</h1>' +
          '<p style="margin:0;font-size:var(--t-md);color:var(--ink-2);max-width:250px">Don&#39;t close the page.</p>' +
        '</div>'
      );
    }

    function locationLabel_() {
      if (ctx.locationResult === 'inside') return 'Within radius';
      if (ctx.locationResult === 'skipped_field') return 'Not tracked for this status';
      return 'Outside expected radius';
    }

    function renderConfirmed() {
      var receipt = [
        { label: 'Status', value: statusLabel_() },
        { label: 'Recorded', value: ctx.arrivalTimeDisplay || '—' },
        { label: 'Source', value: 'Self check-in' },
        { label: 'Location', value: locationLabel_() }
      ];
      render(
        '<div class="screen" style="align-items:center;text-align:center">' +
          '<div class="icon-circle" style="width:76px;height:76px;background:var(--teal-tint);border:1px solid var(--teal)">' +
            '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#06413F" stroke-width="2.2" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"></path></svg>' +
          '</div>' +
          '<h1 style="font-size:var(--t-xl);line-height:1.3">You&#39;re checked in' + (ctx.arrivalTimeDisplay ? ' at ' + escapeHtml(ctx.arrivalTimeDisplay) : '') + '</h1>' +
          statusChipHtml_(statusLabel_()) +
          '<div class="receipt">' +
            receipt.map(function (r) {
              return '<div class="receipt-row"><span class="rlabel">' + escapeHtml(r.label) + '</span><span class="rvalue">' + escapeHtml(r.value) + '</span></div>';
            }).join('') +
          '</div>' +
          '<p style="margin:0;font-size:var(--t-sm);color:var(--ink-2)">Saved automatically. Nothing else is needed from you today.</p>' +
          '<button id="btn-back" type="button" class="btn-plain">Done</button>' +
        '</div>'
      );
      document.getElementById('btn-back').addEventListener('click', renderAlready);
    }

    function renderDenied() {
      render(
        '<div class="screen">' +
          '<div class="icon-circle" style="width:64px;height:64px;background:var(--flag-tint);border:1px solid var(--flag)">' +
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8F3B18" stroke-width="1.9" aria-hidden="true"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"></path><path d="M9 7l6 6M15 7l-6 6"></path></svg>' +
          '</div>' +
          '<h1 style="font-size:var(--t-xl);line-height:1.3">Checked in at ' + escapeHtml(ctx.arrivalTimeDisplay) + ' without location</h1>' +
          '<div class="chip-row">' + statusChipHtml_(statusLabel_()) + '<span class="badge chip-muted">No location</span></div>' +
          '<p style="margin:0;font-size:var(--t-md);color:var(--ink-2)">Your entry was recorded and sent to the office manager for review. Nothing else is needed from you right now.</p>' +
          '<div class="row-bg-card">' +
            '<div style="font-family:\'Source Serif 4\',Georgia,serif;font-weight:700;font-size:var(--t-lg);margin-bottom:var(--s-2)">To allow location next time</div>' +
            '<ol style="margin:0;padding-left:20px;font-size:var(--t-sm);color:var(--ink-2);line-height:1.8">' +
              '<li>iPhone: Settings, then Safari, then Location, then Ask.</li>' +
              '<li>Android: Chrome, tap the lock icon in the address bar, then Permissions, then Location.</li>' +
              '<li>Reopen this page and tap the button again.</li>' +
            '</ol>' +
          '</div>' +
          '<button id="btn-back" type="button" class="btn-plain">Done</button>' +
        '</div>'
      );
      document.getElementById('btn-back').addEventListener('click', renderAlready);
    }

    function renderAlready() {
      render(
        '<div class="screen">' +
          '<div class="eyebrow">Today</div>' +
          '<h1 style="font-size:var(--t-xl)">You&#39;re checked in for today</h1>' +
          '<div class="tint-card">' +
            '<div class="eyebrow">Recorded arrival</div>' +
            (ctx.arrivalTimeDisplay
              ? '<div class="now-value">' + escapeHtml(ctx.arrivalTimeDisplay) + '</div>'
              : '<div style="margin-top:4px;font-size:var(--t-md);color:var(--ink-2)">No arrival time for this status.</div>') +
            '<div style="margin-top:var(--s-2)">' + statusChipHtml_(statusLabel_()) + '</div>' +
          '</div>' +
          '<button id="btn-req-timeoff" type="button" class="btn-plain">Request time off</button>' +
          '<p style="margin:auto 0 0;font-size:var(--t-sm);color:var(--ink-2)">Already done for today. If this looks wrong, contact your manager.</p>' +
        '</div>'
      );
      document.getElementById('btn-req-timeoff').addEventListener('click', openTimeOff);
    }

    function renderFailed() {
      render(
        '<div class="screen">' +
          '<div role="alert" class="flag-card" style="color:var(--flag)">' +
            '<div style="font-family:\'Source Serif 4\',Georgia,serif;font-weight:700;font-size:var(--t-lg)">Check-in did not save</div>' +
            '<p style="margin:var(--s-2) 0 0;font-size:var(--t-sm);line-height:1.6;color:var(--ink)">' + escapeHtml(ctx.errorMessage || 'Nothing was recorded.') + ' Tap Retry, or contact your manager if this keeps happening.</p>' +
          '</div>' +
          '<button id="btn-retry" type="button" class="btn-primary">Retry</button>' +
          '<button id="btn-back" type="button" class="btn-plain">Back to check-in page</button>' +
        '</div>'
      );
      document.getElementById('btn-retry').addEventListener('click', retryCheckIn);
      document.getElementById('btn-back').addEventListener('click', renderMain);
    }

    // ---- time off request -------------------------------------------------

    function timeOffStatusChip_(status) {
      if (status === 'Approved') return '<span class="badge chip-present">Approved</span>';
      if (status === 'Denied') return '<span class="badge chip-flag">Denied</span>';
      if (status === 'Withdrawn') return '<span class="badge chip-muted">Withdrawn</span>';
      return '<span class="badge chip-muted">Pending</span>';
    }

    function timeOffDateRangeLabel_(r) {
      return r.start_date === r.end_date ? r.start_date : (r.start_date + ' to ' + r.end_date);
    }

    function timeOffListHtml_(list) {
      if (!list) return '<p style="margin:0;font-size:var(--t-sm);color:var(--ink-3)">Loading...</p>';
      if (list.length === 0) return '<p style="margin:0;font-size:var(--t-sm);color:var(--ink-3)">No requests yet.</p>';
      return list.map(function (r) {
        return '<div class="req-card">' +
          '<div class="req-card-head">' +
            '<strong style="font-size:var(--t-sm)">' + escapeHtml(timeOffDateRangeLabel_(r)) + '</strong>' +
            timeOffStatusChip_(r.status) +
          '</div>' +
          '<div style="margin-top:4px;font-size:var(--t-sm);color:var(--ink-2)">' + escapeHtml(r.reason) + '</div>' +
          (r.status !== 'Pending' && r.decision_note ? '<div style="margin-top:4px;font-size:var(--t-xs);color:var(--ink-3)">Manager note: ' + escapeHtml(r.decision_note) + '</div>' : '') +
          (r.status === 'Pending'
            ? '<div class="req-actions">' +
                '<button type="button" class="btn-secondary" data-edit="' + escapeHtml(r.request_id) + '">Edit request</button>' +
                '<button type="button" class="btn-plain" style="color:var(--flag);border-color:var(--flag-border)" data-withdraw="' + escapeHtml(r.request_id) + '">Withdraw</button>' +
              '</div>'
            : '') +
        '</div>';
      }).join('');
    }

    // Re-checks the real check-in state rather than trying to remember which
    // screen opened Time Off - the header button reaches it from every
    // screen, so there's no single "previous view" to restore.
    function timeOffBack_() {
      ctx.timeOffError = null;
      boot();
    }

    function captureTimeOffFormValues_() {
      var s = document.getElementById('to-start'), e = document.getElementById('to-end'), r = document.getElementById('to-reason');
      if (s) ctx.timeOffFormValues.start_date = s.value;
      if (e) ctx.timeOffFormValues.end_date = e.value;
      if (r) ctx.timeOffFormValues.reason = r.value;
    }

    function timeOffTypeChipsHtml_() {
      return TIMEOFF_TYPES.map(function (t) {
        return '<button type="button" class="pill-chip' + (ctx.timeOffType === t ? ' selected' : '') + '" data-type="' + t + '">' + t + '</button>';
      }).join('');
    }

    function startEditTimeOff_(request) {
      ctx.editingRequestId = request.request_id;
      ctx.timeOffFormValues = { start_date: request.start_date, end_date: request.end_date, reason: request.reason };
      ctx.timeOffType = request.type || 'Off';
      ctx.timeOffError = null;
      renderTimeOff();
    }

    function cancelEditTimeOff_() {
      ctx.editingRequestId = null;
      ctx.timeOffFormValues = {};
      ctx.timeOffType = 'Off';
      ctx.timeOffError = null;
      renderTimeOff();
    }

    function renderTimeOff() {
      var fv = ctx.timeOffFormValues || {};
      var editingRequest = ctx.editingRequestId && ctx.timeOffRequests
        ? ctx.timeOffRequests.filter(function (r) { return r.request_id === ctx.editingRequestId; })[0]
        : null;

      render(
        '<div class="screen">' +
          '<button id="btn-timeoff-back" type="button" class="back-link">' +
            '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg> Back' +
          '</button>' +
          '<div class="eyebrow">Time off</div>' +
          '<h1 style="font-size:var(--t-xl)">Request time off</h1>' +
          (editingRequest
            ? '<div class="tint-card" style="display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)">' +
                '<span style="font-size:var(--t-sm);color:var(--ink-2)">Editing your pending request for ' + escapeHtml(timeOffDateRangeLabel_(editingRequest)) + '</span>' +
                '<button type="button" id="btn-timeoff-cancel-edit" class="link-btn">Cancel</button>' +
              '</div>'
            : '') +
          '<div>' +
            '<label class="field-label" for="to-start">Start date</label>' +
            '<input id="to-start" type="date" class="field-input" value="' + escapeHtml(fv.start_date || '') + '">' +
          '</div>' +
          '<div>' +
            '<label class="field-label" for="to-end">End date</label>' +
            '<div class="field-hint">Leave blank for a single day</div>' +
            '<input id="to-end" type="date" class="field-input" value="' + escapeHtml(fv.end_date || '') + '">' +
          '</div>' +
          '<div>' +
            '<label class="field-label">Type</label>' +
            '<div class="chip-row" id="timeoff-type-chips">' + timeOffTypeChipsHtml_() + '</div>' +
          '</div>' +
          '<div>' +
            '<label class="field-label" for="to-reason">Reason</label>' +
            '<textarea id="to-reason" class="field-input" rows="3" placeholder="A few words for your manager">' + escapeHtml(fv.reason || '') + '</textarea>' +
          '</div>' +
          (ctx.timeOffError ? '<p role="alert" style="margin:0;color:var(--flag);font-size:var(--t-sm)">' + escapeHtml(ctx.timeOffError) + '</p>' : '') +
          '<button id="btn-timeoff-submit" type="button" class="btn-primary">' + (editingRequest ? 'Save changes' : 'Submit request') + '</button>' +
          '<div style="border-top:1px solid var(--line);padding-top:var(--s-4)">' +
            '<h2 style="font-size:var(--t-lg);margin-bottom:var(--s-2)">Your requests</h2>' +
            '<div id="timeoff-list">' + timeOffListHtml_(ctx.timeOffRequests) + '</div>' +
          '</div>' +
        '</div>'
      );
      document.getElementById('btn-timeoff-back').addEventListener('click', timeOffBack_);
      document.getElementById('btn-timeoff-submit').addEventListener('click', submitTimeOffFlow);
      if (editingRequest) document.getElementById('btn-timeoff-cancel-edit').addEventListener('click', cancelEditTimeOff_);

      document.querySelectorAll('#timeoff-type-chips [data-type]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          captureTimeOffFormValues_();
          ctx.timeOffType = btn.dataset.type;
          renderTimeOff();
        });
      });
      document.querySelectorAll('#timeoff-list [data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var req = (ctx.timeOffRequests || []).filter(function (r) { return r.request_id === btn.dataset.edit; })[0];
          if (req) startEditTimeOff_(req);
        });
      });
      document.querySelectorAll('#timeoff-list [data-withdraw]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Withdraw this request?')) return;
          var requestId = btn.dataset.withdraw;
          call('withdrawTimeOffRequest', TOKEN, requestId).then(function (list) {
            if (ctx.editingRequestId === requestId) cancelEditTimeOff_();
            ctx.timeOffRequests = list;
            renderTimeOff();
          }).catch(function (err) {
            ctx.timeOffError = err && err.message ? err.message : 'Something went wrong.';
            renderTimeOff();
          });
        });
      });
    }

    function openTimeOff() {
      ctx.timeOffError = null;
      ctx.timeOffRequests = null;
      ctx.editingRequestId = null;
      ctx.timeOffFormValues = {};
      ctx.timeOffType = 'Off';
      renderTimeOff();
      call('getMyTimeOffRequests', TOKEN).then(function (list) {
        ctx.timeOffRequests = list;
        renderTimeOff();
      }).catch(function () {
        ctx.timeOffRequests = [];
        renderTimeOff();
      });
    }

    function submitTimeOffFlow() {
      var start = document.getElementById('to-start').value;
      var end = document.getElementById('to-end').value || start;
      var reason = document.getElementById('to-reason').value.trim();
      var type = ctx.timeOffType;
      ctx.timeOffError = null;
      if (!start) { ctx.timeOffError = 'Start date is required.'; renderTimeOff(); return; }
      if (!reason) { ctx.timeOffError = 'A reason is required.'; renderTimeOff(); return; }
      if (end < start) { ctx.timeOffError = 'End date cannot be before start date.'; renderTimeOff(); return; }

      var btn = document.getElementById('btn-timeoff-submit');
      var editingId = ctx.editingRequestId;
      btn.disabled = true;
      btn.textContent = editingId ? 'Saving...' : 'Submitting...';

      var promise = editingId
        ? call('editTimeOffRequest', TOKEN, editingId, { start_date: start, end_date: end, reason: reason, type: type })
        : call('submitTimeOffRequest', TOKEN, { start_date: start, end_date: end, reason: reason, type: type });

      promise.then(function (list) {
        ctx.timeOffRequests = list;
        ctx.editingRequestId = null;
        ctx.timeOffFormValues = {};
        ctx.timeOffType = 'Off';
        renderTimeOff();
      }).catch(function (err) {
        ctx.timeOffError = err && err.message ? err.message : 'Something went wrong.';
        renderTimeOff();
      });
    }

    // ---- geolocation + submit flow --------------------------------------

    /** Same geolocation capture shape/behavior as GeoTest.html. */
    function captureGeo() {
      return new Promise(function (resolve) {
        if (!('geolocation' in navigator)) {
          resolve({ permissionState: 'unavailable' });
          return;
        }
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          resolve({ permissionState: 'unavailable' });
        }, 10000);
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve({
              permissionState: 'granted',
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracyM: pos.coords.accuracy
            });
          },
          function (err) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve({ permissionState: err.code === 1 ? 'denied' : 'unavailable' });
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    function startCheckIn(status) {
      ctx.pendingStatus = status;
      var noteEl = document.getElementById('noteInput');
      if (noteEl) ctx.note = noteEl.value;

      // WFH has no physical location to check, so skip the geolocation
      // prompt entirely rather than asking for a permission that would
      // never be used (locationResultForCheckIn always skips WFH too -
      // see shared/rules.js).
      if (status === 'WFH') {
        ctx.pendingGeo = { permissionState: 'unavailable' };
        renderSaving();
        call('selfCheckIn', TOKEN, status, ctx.pendingGeo, navigator.userAgent, ctx.note)
          .then(handleCheckInSuccess).catch(handleCheckInFailure);
        return;
      }

      renderLocating();
      captureGeo().then(function (geo) {
        ctx.pendingGeo = geo;
        renderSaving();
        call('selfCheckIn', TOKEN, status, geo, navigator.userAgent, ctx.note)
          .then(handleCheckInSuccess).catch(handleCheckInFailure);
      });
    }

    function retryCheckIn() {
      startCheckIn(ctx.pendingStatus);
    }

    function handleCheckInSuccess(data) {
      ctx.status = data.status;
      ctx.arrivalTimeDisplay = data.arrivalTimeDisplay;
      ctx.locationResult = data.locationResult;
      ctx.empRole = data.empRole || ctx.empRole;
      setFooterRole();
      var noLocation = ctx.locationResult === 'denied' || ctx.locationResult === 'unavailable';
      if (noLocation) renderDenied(); else renderConfirmed();
    }

    function handleCheckInFailure(err) {
      ctx.errorMessage = err && err.message ? err.message : 'Something went wrong.';
      renderFailed();
    }

    // ---- boot -----------------------------------------------------------

    function handleBootData(data) {
      if (data.state === 'invalid') {
        document.getElementById('headerTimeOffBtn').style.display = 'none';
        showInvalidView('This check-in link isn\'t valid. Contact your manager for a new one.');
        return;
      }
      if (data.state === 'inactive') {
        document.getElementById('headerTimeOffBtn').style.display = 'none';
        showInvalidView('This check-in link has been deactivated. Contact your manager if you think this is a mistake.');
        return;
      }

      document.getElementById('headerTimeOffBtn').style.display = '';
      ctx.firstName = data.firstName;
      ctx.empRole = data.empRole || '';
      ctx.todayLong = data.todayLong;
      setFooterRole();

      if (data.state === 'done') {
        ctx.status = data.status;
        ctx.arrivalTimeDisplay = data.arrivalTimeDisplay;
        ctx.locationResult = data.locationResult;
        renderAlready();
        return;
      }

      ctx.nowLabel = data.nowLabel;
      if (seenHomeTip()) renderMain(); else renderFirst();
    }

    function boot() {
      if (!TOKEN) {
        showInvalidView('This check-in link isn\'t valid. Contact your manager for a new one.');
        return;
      }
      renderLoading();
      call('getCheckInPageData', TOKEN)
        .then(handleBootData)
        .catch(function () { showInvalidView('This check-in link isn\'t valid. Contact your manager for a new one.'); });
    }

    // Lives in the static header, not inside #app, so it's reachable from
    // every screen (checked in or not) without each render function having
    // to re-add its own copy.
    document.getElementById('headerTimeOffBtn').addEventListener('click', openTimeOff);

    boot();
  </script>
</body>
</html>
